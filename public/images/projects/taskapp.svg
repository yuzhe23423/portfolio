<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="taskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#taskGradient)"/>

  <g id="checklist-icon">
    <circle cx="400" cy="150" r="50" fill="white" opacity="0.2"/>
    <rect x="360" y="130" width="80" height="50" rx="5" fill="none" stroke="white" stroke-width="3" opacity="0.7"/>
    <polyline points="370,150 380,160 395,140" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <line x1="410" y1="148" x2="435" y2="148" stroke="white" stroke-width="2" opacity="0.7"/>
  </g>

  <text x="400" y="300" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">Task Management</text>
</svg>