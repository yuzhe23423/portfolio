<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="blogGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#blogGradient)"/>

  <g id="blog-icon">
    <circle cx="400" cy="150" r="50" fill="white" opacity="0.2"/>
    <rect x="360" y="120" width="80" height="60" rx="3" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="365" y1="135" x2="435" y2="135" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="365" y1="150" x2="435" y2="150" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="365" y1="165" x2="420" y2="165" stroke="white" stroke-width="2" opacity="0.7"/>
  </g>

  <text x="400" y="300" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">Personal Blog</text>
</svg>